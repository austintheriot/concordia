<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />

    <!-- Preloading EBGaramond Fonts -->
    <!-- See https://googlefonts.github.io/ebgaramond-specimen/ -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/EBGaramond.ttf"
      type="font/ttf"
      as="font"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/EBGaramond-Italic.ttf"
      type="font/ttf"
      as="font"
      crossorigin
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
